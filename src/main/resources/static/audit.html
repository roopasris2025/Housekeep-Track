<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>StayEase | Audit Logs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

</head><body>
<div class="app"><aside class="sidebar" id="sidebar"></aside>
<div class="main"><header class="topbar" id="topbar"></header>
<main class="content">

<div class="panel"><div class="panel-head"><h3>Audit Trail</h3></div>
<div class="table-wrap"><table><thead><tr><th>Action</th><th>Entity</th><th>Entity ID</th><th>Performed By</th><th>Old Value</th><th>New Value</th><th>Date / Time</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="pager" id="pager"></div></div>
</main></div></div>
<script src="js/app.js"></script>
<script>
initLayout('audit', 'Audit Logs');

let page = 0;
async function load() {
  try {
    const p = await api(`/audit-logs?page=${page}&size=15&sort=createdAt,desc`);
    document.getElementById("rows").innerHTML = p.content.length ? p.content.map(a => `<tr><td><b>${esc(a.action)}</b></td><td>${esc(a.entityName)}</td><td>${a.entityId ?? "-"}</td><td>${esc(a.performedBy)}</td>
      <td>${esc(a.oldValue || "-")}</td><td>${esc(a.newValue || "-")}</td><td>${fmt(a.createdAt)}</td></tr>`).join("") : `<tr><td colspan="7" class="empty">No activity recorded yet.</td></tr>`;
    pager("pager", p, n => { page = n; load(); });
  } catch (e) { toast(e.message, "error"); }
}
load();
</script>
</body></html>
