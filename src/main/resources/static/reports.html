<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>StayEase | Reports</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head><body>
<div class="app"><aside class="sidebar" id="sidebar"></aside>
<div class="main"><header class="topbar" id="topbar"></header>
<main class="content">

<div class="cards"><div class="stat gold"><small>Average Room Turnaround</small><strong id="avg">-</strong></div><div class="stat"><small>Rooms counted</small><strong id="cnt">-</strong></div></div>
<div class="grid2">
  <div class="panel"><div class="panel-head"><h3>Room Status Summary</h3></div><canvas id="sChart" height="200"></canvas><table style="margin-top:12px"><tbody id="sRows"></tbody></table></div>
  <div class="panel"><div class="panel-head"><h3>Housekeeper Workload</h3></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Status</th><th>Active</th><th>Completed</th></tr></thead><tbody id="wRows"></tbody></table></div></div>
</div>
</main></div></div>
<script src="js/app.js"></script>
<script>
initLayout('reports', 'Reports');

(async () => {
  try {
    const [t, s, w] = await Promise.all([api("/reports/turnaround-time"), api("/reports/room-status-summary"), api("/reports/housekeeper-workload")]);
    avg.textContent = t.averageMinutes + " min"; cnt.textContent = t.roomsCounted;
    sRows.innerHTML = Object.entries(s).map(([k, v]) => `<tr><td>${badge(k)}</td><td><b>${v}</b> rooms</td></tr>`).join("");
    wRows.innerHTML = w.length ? w.map(h => `<tr><td><b>${esc(h.name)}</b></td><td>${badge(h.status)}</td><td>${h.activeTasks}</td><td>${h.completedTasks}</td></tr>`).join("") : `<tr><td colspan="4" class="empty">No housekeepers.</td></tr>`;
    if (window.Chart) new Chart(sChart, {type: "bar", data: {labels: Object.keys(s), datasets: [{data: Object.values(s), backgroundColor: ["#C0392B", "#D68910", "#2E86C1", "#1E8E5A"]}]},
      options: {plugins: {legend: {display: false}}, scales: {y: {beginAtZero: true, ticks: {precision: 0}}}}});
  } catch (e) { toast(e.message, "error"); }
})();
</script>
</body></html>
